<mat-toolbar color="primary" class="app-toolbar">
  <span>{{ title }}</span>
  <span class="toolbar-spacer"></span>
  <button
    mat-button
    [class.active-route]="isRouteActive('/dashboard')"
    (click)="navigateToDashboard()">
    <mat-icon>dashboard</mat-icon>
    Dashboard
  </button>
  <button
    mat-button
    [class.active-route]="isRouteActive('/map')"
    (click)="navigateToMap()">
    <mat-icon>map</mat-icon>
    Map View
  </button>
</mat-toolbar>

<mat-progress-bar
  *ngIf="isLoading"
  mode="indeterminate"
  color="accent">
</mat-progress-bar>

<div class="app-container">
  <router-outlet></router-outlet>
</div>
